plugins {
    id 'com.android.application'
}

android {
    compileSdkVersion 36
    namespace "com.cooopal.app"
    defaultConfig {
        applicationId "com.cooopal.app"
        minSdkVersion 21
        targetSdkVersion 36
        versionCode 3
        versionName "3"

        resValue "string", "appName", "CooPal"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
}
